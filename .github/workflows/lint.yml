name: Lint

on: [push, pull_request]

jobs:
  rubocop:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Run rubocop
        run: |
          bundle exec rubocop --format github