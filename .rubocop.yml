plugins:
  - rubocop-rspec

AllCops:
  Exclude:
    - 'vendor/**/*'
  NewCops: enable
  TargetRubyVersion: 3.3

Naming/FileName:
  Exclude:
    - 'lib/jira-ruby.rb'

Naming/MethodName:
  Enabled: false

# The shared examples in spec/support/shared_examples/integration.rb need ten
# `let` names. Thus the specs in spec/integration cannot obey this limit, and
# they are excluded. This cop has no IgnoreMetadata option, thus the exclusion
# uses the path.
#
# The limit of 13 applies to the other specs. Groups in spec/jira inherit the
# `let` statements of their parent groups, and this cop counts the inherited
# statements again at each level.
#
# The spec for the HTTP client is also excluded. It has twelve clients at the top
# level, and each client has a different configuration. Its
# `#make_multipart_request` group adds six more `let` statements, but it uses only
# one of the twelve clients. Thus its count of 17 is an effect of inheritance, not
# of too many helpers in the group.
RSpec/MultipleMemoizedHelpers:
  Max: 13
  Exclude:
    - 'spec/integration/**/*'
    - 'spec/jira/http_client_spec.rb'

# The specs in spec/integration test a resource, but they are not in the
# spec/jira/resource directory. Each of these specs has `type: :integration`
# metadata, which tells this cop to ignore the path.
RSpec/SpecFilePathFormat:
  IgnoreMetadata:
    type: integration

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Exclude:
    - 'spec/**/*'

##
# Temporarily Disable
# 
# We are going to disable these and fix in pull requests
##
Lint/MissingSuper:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: false

Naming/PredicatePrefix:
  Enabled: false

Naming/PredicateMethod:
  AllowBangMethods: true

Naming/VariableNumber:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/ExpectInHook:
  Enabled: false

RSpec/MessageSpies:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/NamedSubject:
  Enabled: false

RSpec/NestedGroups:
  Enabled: false

RSpec/StubbedMock:
  Enabled: false

RSpec/SubjectStub:
  Enabled: false

RSpec/VerifiedDoubles:
  Enabled: false

Style/MissingRespondToMissing:
  Enabled: false

Style/OptionalBooleanParameter:
  Enabled: false
